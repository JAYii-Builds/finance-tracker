[build]
  command = "pnpm --filter @workspace/finance-dashboard run build:netlify"
  publish = "artifacts/finance-dashboard/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route /api/transactions/:id → transaction-by-id function (must come before the broader rule)
[[redirects]]
  from = "/api/transactions/:id"
  to = "/.netlify/functions/transaction-by-id?id=:id"
  status = 200
  force = true

# Route /api/transactions → transactions function
[[redirects]]
  from = "/api/transactions"
  to = "/.netlify/functions/transactions"
  status = 200
  force = true

# Route /api/stats → stats function
[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [[plugins]]
  package = "@netlify/plugin-functions-install-core"
