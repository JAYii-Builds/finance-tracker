openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Finance Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction operations
  - name: categories
    description: Category operations
  - name: stats
    description: Statistics and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Month filter in YYYY-MM format"
        - name: category
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /stats/monthly:
    get:
      operationId: getMonthlyStats
      tags: [stats]
      summary: Get monthly income/expense stats for a full year
      parameters:
        - name: year
          in: query
          schema:
            type: integer
          description: "Year to get stats for (defaults to current year)"
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyStats"

  /stats/summary:
    get:
      operationId: getMonthlySummary
      tags: [stats]
      summary: Get summary KPIs for a given month
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Month in YYYY-MM format (defaults to current month)"
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummary"

  /stats/by-category:
    get:
      operationId: getStatsByCategory
      tags: [stats]
      summary: Get expense breakdown by category for a month
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Month in YYYY-MM format (defaults to current month)"
      responses:
        "200":
          description: Spending by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Transaction:
      type: object
      required: [id, date, amount, description, type, categoryId, categoryName, categoryColor, categoryIcon]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        amount:
          type: number
        description:
          type: string
        type:
          type: string
          enum: [income, expense]
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryColor:
          type: string
        categoryIcon:
          type: string

    TransactionInput:
      type: object
      required: [date, amount, description, type, categoryId]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        description:
          type: string
        type:
          type: string
          enum: [income, expense]
        categoryId:
          type: integer

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        description:
          type: string
        type:
          type: string
          enum: [income, expense]
        categoryId:
          type: integer

    Category:
      type: object
      required: [id, name, color, icon, type]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        type:
          type: string
          enum: [income, expense, both]

    CategoryInput:
      type: object
      required: [name, color, icon, type]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        type:
          type: string
          enum: [income, expense, both]

    MonthlyStats:
      type: object
      required: [month, income, expenses]
      properties:
        month:
          type: string
        income:
          type: number
        expenses:
          type: number

    MonthlySummary:
      type: object
      required: [month, totalIncome, totalExpenses, netSavings, savingsRate, prevMonthIncome, prevMonthExpenses]
      properties:
        month:
          type: string
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netSavings:
          type: number
        savingsRate:
          type: number
        prevMonthIncome:
          type: number
        prevMonthExpenses:
          type: number

    CategoryStats:
      type: object
      required: [categoryId, categoryName, categoryColor, categoryIcon, total, percentage]
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryColor:
          type: string
        categoryIcon:
          type: string
        total:
          type: number
        percentage:
          type: number
